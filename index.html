    function useCursor() {
      useEffect(() => {
        const dot = document.getElementById('cursorDot');
        const ring = document.getElementById('cursorRing');
        let rx = 0, ry = 0, dx = 0, dy = 0, raf;
        const onMove = e => { dx = e.clientX; dy = e.clientY; };
        document.addEventListener('mousemove', onMove);
        const onEnter = () => ring.classList.add('hov');
        const onLeave = () => ring.classList.remove('hov');
        const addListeners = () => {
          document.querySelectorAll('button,a,[role=button]').forEach(el => {
            el.addEventListener('mouseenter', onEnter);
            el.addEventListener('mouseleave', onLeave);
          });
        };
        addListeners();
        const obs = new MutationObserver(addListeners);
        obs.observe(document.body, { childList: true, subtree: true });
        const tick = () => {
          rx += (dx - rx) * .12; ry += (dy - ry) * .12;
          dot.style.left = dx + 'px'; dot.style.top = dy + 'px';
          ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
          raf = requestAnimationFrame(tick);
        };
        tick();
        return () => { document.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); obs.disconnect(); };
      }, []);

    function colorDist(a, b) {
      const [r1,g1,b1]=hexToRgb(a), [r2,g2,b2]=hexToRgb(b);
      return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);
    }
    const MAX_DIST = 441.67;
    function tint(hex) {
      const [r,g,b] = hexToRgb(hex);
      return `rgb(${Math.round(r*.55+12)},${Math.round(g*.52+10)},${Math.round(b*.5+8)})`;
    }

    function scoreItem(item, profile) {
      const ts = item.tags.filter(t=>profile.tags.includes(t)).length / Math.max(1,Math.min(3,profile.tags.length));
      let cs = 0;
      if(profile.cats.includes(item.cat)) cs=1;
      else if(profile.cats.some(c=>(ADJACENT[c]||[]).includes(item.cat))) cs=0.4;
      let cols = 0.5;
      if(profile.colors.length){
        const near = Math.min(...profile.colors.map(c=>colorDist(c,item.hex)));
        cols = 1 - near/MAX_DIST;
      }
      return Math.round((ts*.55+cs*.2+cols*.25)*100);
    }

    /* ── SVG Garment ── */
    function Garment({sil, hex}) {
      const stroke = 'rgba(255,255,255,0.15)';
      const p = {fill:hex, stroke, strokeWidth:2, strokeLinejoin:'round', strokeLinecap:'round'};
      const paths = {
        tee:   <path {...p} d="M35 28 L52 18 Q60 26 60 26 L75 16 L90 30 L80 44 L72 38 L72 96 Q60 100 40 96 L40 38 L32 44 Z"/>,
        knit:  <path {...p} d="M30 30 L48 20 L60 26 L72 20 L90 30 L82 50 L74 44 L74 98 Q60 102 46 98 L46 44 L38 50 Z"/>,
        coat:  <path {...p} d="M32 26 L50 18 L60 24 L70 18 L88 26 L82 52 L74 48 L74 102 L60 100 L60 50 L60 100 L46 102 L46 48 L38 52 Z"/>,
        pants: <path {...p} d="M40 20 L80 20 L80 36 L74 102 L62 102 L60 56 L58 102 L46 102 L40 36 Z"/>,
        skirt: <path {...p} d="M42 22 L78 22 L80 36 L92 100 Q60 108 28 100 L40 36 Z"/>,
        dress: <path {...p} d="M40 18 L52 14 L60 20 L68 14 L80 18 L74 40 L72 50 L90 102 Q60 110 30 102 L48 50 L46 40 Z"/>,
        shoe:  <path {...p} d="M22 60 L70 60 Q92 60 96 76 L96 84 L20 84 Q16 84 16 76 L18 64 Z"/>,
        bag:   <path {...p} d="M34 44 L86 44 L92 100 L28 100 Z M44 44 Q44 24 60 24 Q76 24 76 44" fill={hex}/>,
      };
      const gid = `g${hex.replace('#','')}`;
      return (
        <svg viewBox="0 0 120 120" width="100%" height="100%" style={{display:'block'}}>
          <defs>
            <radialGradient id={gid} cx="35%" cy="30%" r="70%">
              <stop offset="0%" stopColor="rgba(255,255,255,0.18)"/>
              <stop offset="100%" stopColor="rgba(0,0,0,0.3)"/>
            </radialGradient>
          </defs>
          {paths[sil] || paths.tee}
          <rect x="0" y="0" width="120" height="120" fill={`url(#${gid})`} style={{mixBlendMode:'overlay'}}/>
        </svg>
      );
    }

    /* ── Scroll reveal ── */
    function RevealSection({children, delay=0, style={}}) {
      const ref = useRef(null);
      const [v, setV] = useState(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e])=>{if(e.isIntersecting)setV(true)},{threshold:.12});
        if(ref.current) obs.observe(ref.current);
        return ()=>obs.disconnect();
      }, []);
      return (
        <div ref={ref} style={{
          opacity:v?1:0, transform:v?'none':'translateY(36px)',
          transition:`opacity .9s ease ${delay}ms, transform .9s cubic-bezier(.22,.61,.36,1) ${delay}ms`,
          ...style,
        }}>{children}</div>
      );
    }

    /* ── Marquee ── */
    function Marquee() {
      const txt = ['ÉCHO','·','패션 아카이브','·','1920s — 2020s','·','ERA FASHION','·','스타일 탐색','·','DISCOVER YOUR ERA','·'].join('  ');
      return (
        <div style={{overflow:'hidden',borderTop:'1px solid rgba(255,255,255,.06)',borderBottom:'1px solid rgba(255,255,255,.06)',padding:'10px 0',background:'rgba(255,255,255,.015)'}}>
          <div style={{display:'flex',gap:'2em',animation:'mq 30s linear infinite',width:'max-content',fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:'2px',color:'rgba(240,236,226,.25)'}}>
            {[...Array(5)].map((_,i)=><span key={i}>{txt}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>)}
          </div>
          <style>{`@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-20%)}}`}</style>
        </div>
      );
    }

    /* ── Item Card ── */
    function ItemCard({item, onClick, match}) {

          }}>

          }}>

              <Garment sil={item.sil} hex={item.hex}/>
            </div>
            {match!=null&&(
              <span style={{position:'absolute',top:8,left:8,background:'rgba(232,213,163,.95)',color:'#0a0a08',fontFamily:"'DM Mono',monospace",fontSize:'9px',letterSpacing:'.5px',padding:'3px 8px',borderRadius:20,fontWeight:600}}>
                {match}% 매칭
              </span>
            )}
            {!match&&era&&(
              <span style={{position:'absolute',top:8,right:8,background:'rgba(0,0,0,.65)',color:era.accent,fontFamily:"'DM Mono',monospace",fontSize:'9px',letterSpacing:1,padding:'3px 8px',borderRadius:20}}>
                {item.era}
              </span>
            )}
            <span style={{position:'absolute',bottom:8,right:8,width:12,height:12,borderRadius:'50%',background:item.hex,border:'2px solid rgba(255,255,255,.35)',boxShadow:'0 1px 6px rgba(0,0,0,.5)'}}/>
            <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 55%)',opacity:hov?1:0,transition:'opacity .35s'}}/>
          </div>
          <div style={{padding:'8px 1px 0'}}>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontWeight:600,color:'#f0ece2',lineHeight:1.2}}>{item.name}</div>
            <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:5,alignItems:'center'}}>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:'9px',color:era?.accent||'#c8b89a',letterSpacing:'.5px'}}>{CAT_KO[item.cat]}</span>
              {item.tags.map(t=>(
                <span key={t} style={{fontSize:'10px',color:'rgba(240,236,226,.4)',fontFamily:"'Noto Sans KR'"}}>{STYLE_KO[t]}</span>
              ))}

          </div>
        </button>
      );

    function EraCard({era, onSelect, active}) {

    /* ── Main App ── */
    function App() {
      useCursor();
      const [activeEra, setActiveEra] = useState(null);
      const [profile, setProfile] = useState(null);
      const [uploadedImg, setUploadedImg] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [error, setError] = useState(null);
      const [view, setView] = useState('home'); // home | era | match
      const fileRef = useRef(null);
      const contentRef = useRef(null);

      const currentEra = useMemo(()=>ERAS.find(e=>e.id===activeEra),[activeEra]);
      const matches = useMemo(()=>{
        if(!profile) return [];
        return CATALOG
          .map(i=>({item:i, score:scoreItem(i,profile)}))
          .filter(x=>x.score>15)
          .sort((a,b)=>b.score-a.score)
          .slice(0,12);
      },[profile]);

      function selectEra(id) {
        setActiveEra(id); setView('era'); setProfile(null);
        setTimeout(()=>contentRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),80);
      }
      function pickItem(item) {
        const era = ERAS.find(e=>e.id===item.era);
        setError(null);
        setProfile({tags:item.tags,cats:[item.cat],colors:[item.hex],sourceId:item.id,
          vibe:item.name,img:null,swatches:[item.hex],accent:era?.accent||'#c8b89a'});
        setView('match');
        setTimeout(()=>contentRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),80);
      }
      function goHome() { setView('home'); setActiveEra(null); setProfile(null); setUploadedImg(null); setError(null); }

      async function onUpload(e) {
        const file = e.target.files?.[0];
        if(!file) return;
        setError(null);
        const reader = new FileReader();
        reader.onload = async () => {
          const dataUrl = reader.result;
          const base64 = dataUrl.split(',')[1];
          setUploadedImg(dataUrl);
          setAnalyzing(true);
          try {
            const sys = `You are a fashion historian. Analyze the outfit in the image. Respond ONLY with valid JSON:
{"vibe":"Korean phrase max 8 words","era":"1920s|1950s|1960s|1970s|1980s|1990s|2000s|2010s|2020s","styleTags":["1-3 from: minimal,streetwear,vintage,romantic,tailored,athleisure,boho,edgy,preppy,monochrome"],"categories":["1-3 from: top,bottom,dress,outerwear,knitwear,shoes,bag,accessory"],"colors":["1-3 dominant hex codes"]}`;
            const res = await fetch('https://api.anthropic.com/v1/messages',{
              method:'POST',
              headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'},
              body:JSON.stringify({
                model:'claude-sonnet-4-20250514',max_tokens:800,system:sys,
                messages:[{role:'user',content:[
                  {type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:base64}},
                  {type:'text',text:'이 패션 이미지를 분석해줘.'},
                ]}],
              }),
            });
            const data = await res.json();
            const text = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
            const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
            const tags = (parsed.styleTags||[]).filter(t=>STYLE_KO[t]);
            const cats = (parsed.categories||[]).filter(c=>CAT_KO[c]);
            const colors = (parsed.colors||[]).filter(c=>/^#[0-9a-fA-F]{6}$/.test(c));
            const era = ERAS.find(e=>e.id===parsed.era)||ERAS[6];
            setProfile({
              tags:tags.length?tags:['minimal'], cats:cats.length?cats:['top'],
              colors:colors.length?colors:['#aaaaaa'],
              sourceId:-1, vibe:parsed.vibe||'분석된 스타일', img:dataUrl,
              swatches:colors, accent:era.accent,
            });
            setView('match');
            setTimeout(()=>contentRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),80);
          } catch(err) {
            setError('이미지 분석에 실패했어요. API 키가 필요하거나 네트워크 오류입니다.');
          } finally {
            setAnalyzing(false);
          }
        };
        reader.readAsDataURL(file);
      }

      return (
        <div style={{minHeight:'100vh',background:'#0a0a08',paddingBottom:100}}>

          {/* ── Header ── */}

            position:'sticky',top:0,zIndex:100,
            display:'flex',justifyContent:'space-between',alignItems:'center',
            padding:'16px 44px',
            background:'rgba(10,10,8,.94)',backdropFilter:'blur(24px)',
            borderBottom:'1px solid rgba(255,255,255,.05)',

              <span style={{fontFamily:"'Playfair Display',serif",fontWeight:900,fontSize:24,color:'#f0ece2',letterSpacing:2}}>ÉCHO</span>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:'3px',color:'rgba(240,236,226,.3)'}}>FASHION ARCHIVE</span>
            </button>

            </nav>
          </header>

          <Marquee/>

          {view==='home'&&(

              {/* Hero */}

                <div>

                        <div style={{width:'58%',height:'58%'}}>
                          <Garment sil={look.sil} hex={era.palette[0]}/>
                        </div>
                        <span style={{position:'absolute',bottom:7,right:7,fontFamily:"'DM Mono',monospace",fontSize:'8px',color:era.accent,letterSpacing:1}}>{era.label}</span>
                      </div>
                    );
                  })}
                  <style>{`
                    @keyframes fl0{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-14px) rotate(-2.5deg)}}
                    @keyframes fl1{0%,100%{transform:translateY(0) rotate(1.8deg)}50%{transform:translateY(-18px) rotate(1.8deg)}}

              {/* Stats row */}
              <RevealSection style={{maxWidth:1300,margin:'0 auto',padding:'0 44px 80px'}}>

                  {[{n:'9',d:'시대별 아카이브',s:'1920s — 2020s'},{n:'54+',d:'큐레이션 룩',s:'각 시대 대표 스타일'},{n:'AI',d:'스타일 분석',s:'이미지로 닮은 옷 찾기'}].map((f,i)=>(
                    <div key={i} style={{padding:'36px 32px',borderRight:i<2?'1px solid rgba(255,255,255,.06)':'none',background:'rgba(255,255,255,.01)'}}>
                      <div style={{fontFamily:"'Playfair Display',serif",fontSize:50,fontWeight:900,color:'#c8b89a',marginBottom:6}}>{f.n}</div>
                      <div style={{fontFamily:"'Noto Sans KR'",fontSize:15,color:'#f0ece2',marginBottom:4}}>{f.d}</div>

              {/* Era scroll */}
              <section id="eras" style={{padding:'0 44px 80px',maxWidth:1600,margin:'0 auto'}}>

                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:36,borderBottom:'1px solid rgba(255,255,255,.07)',paddingBottom:18}}>
                    <div>
                      <div style={{fontFamily:"'DM Mono',monospace",fontSize:'9.5px',letterSpacing:'4px',color:'rgba(200,184,154,.4)',marginBottom:7}}>EXPLORE BY ERA</div>
                      <h2 style={{fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:'clamp(26px,3.5vw,44px)',color:'#f0ece2'}}>시대별 스타일</h2>

                  {currentEra.keywords.map(k=>(
                    <span key={k} style={{fontFamily:"'Noto Sans KR'",fontSize:11,border:`1px solid ${currentEra.accent}55`,color:currentEra.accent,padding:'4px 14px',borderRadius:20}}>{k}</span>
                  ))}
                </div>
                {/* Palette */}
                <div style={{display:'flex',gap:0,height:5,maxWidth:280,borderRadius:2,overflow:'hidden'}}>
                  {currentEra.palette.map((c,i)=><div key={i} style={{flex:1,background:c}}/>)}
                </div>
              </div>
              <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:'#f0ece2',marginBottom:20,fontWeight:600}}>시대 아이템</h3>
              <div style={{columnCount:5,columnGap:14}}>
                {currentEra.looks.map(look=>(
                  <ItemCard key={look.id} item={look} onClick={pickItem}/>
                ))}
              </div>

              {/* All eras carousel at bottom */}
              <div style={{marginTop:70,borderTop:'1px solid rgba(255,255,255,.06)',paddingTop:40}}>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:'9.5px',letterSpacing:'3px',color:'rgba(240,236,226,.25)',marginBottom:22}}>OTHER ERAS</div>
                <div style={{display:'flex',gap:16,overflowX:'auto',scrollbarWidth:'none'}}>
                  {ERAS.filter(e=>e.id!==currentEra.id).map(era=>(
                    <EraCard key={era.id} era={era} onSelect={selectEra} active={false}/>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── MATCH VIEW ── */}
          {view==='match'&&profile&&(
            <div ref={contentRef} style={{padding:'56px 44px',maxWidth:1400,margin:'0 auto',animation:'fI .5s ease'}}>
              <BackBtn onClick={goHome}/>
              {/* Inspiration */}
              <div style={{display:'flex',gap:22,alignItems:'flex-start',borderBottom:'1px solid rgba(255,255,255,.07)',paddingBottom:36,marginBottom:36}}>
                {profile.img
                  ?<img src={profile.img} alt="inspiration" style={{width:86,height:112,objectFit:'cover',borderRadius:2}}/>
                  :<div style={{width:86,height:86,borderRadius:2,background:tint(profile.colors[0]),border:'1px solid rgba(255,255,255,.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <div style={{width:50,height:50}}><Garment sil="dress" hex={profile.colors[0]}/></div>
                  </div>}
                <div>
                  <div style={{fontFamily:"'DM Mono',monospace",fontSize:'8.5px',letterSpacing:'3px',color:'rgba(240,236,226,.25)',marginBottom:5}}>YOUR INSPIRATION</div>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,color:'#f0ece2',marginBottom:10}}>{profile.vibe}</div>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                    {(profile.swatches||[]).slice(0,4).map((c,i)=>(
                      <span key={i} style={{width:16,height:16,borderRadius:'50%',background:c,border:'1px solid rgba(255,255,255,.2)',display:'inline-block'}}/>
                    ))}
                    {profile.tags.map(t=>(
                      <span key={t} style={{fontFamily:"'Noto Sans KR'",fontSize:11,border:`1px solid ${profile.accent||'#c8b89a'}50`,color:profile.accent||'#c8b89a',padding:'3px 12px',borderRadius:20}}>{STYLE_KO[t]}</span>
                    ))}
                  </div>
                </div>
              </div>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:26,color:'#f0ece2',marginBottom:22}}>
                닮은 아이템 <span style={{color:profile.accent||'#c8b89a'}}>{matches.length}</span>
              </h2>
              {matches.length===0
                ?<p style={{fontFamily:"'Noto Sans KR'",color:'rgba(240,236,226,.35)',fontSize:14}}>매칭 아이템이 없습니다.</p>
                :<div style={{columnCount:5,columnGap:14}}>
                  {matches.map(({item,score})=><ItemCard key={item.id} item={item} match={score} onClick={pickItem}/>)}
                </div>}
            </div>
          )}

          <footer style={{marginTop:70,padding:'22px 44px',borderTop:'1px solid rgba(255,255,255,.05)',display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
            <span style={{fontFamily:"'DM Mono',monospace",fontSize:'9.5px',letterSpacing:2,color:'rgba(240,236,226,.18)'}}>ÉCHO — 시대를 관통하는 패션 아카이브 · 1920–2020</span>
            <span style={{fontFamily:"'DM Mono',monospace",fontSize:'9.5px',letterSpacing:2,color:'rgba(240,236,226,.18)'}}>POWERED BY CLAUDE VISION</span>
          </footer>
        </div>
      );
    }

    /* ── Small components ── */
    function Btn({children, onClick, primary}) {
      const [hov,setHov]=useState(false);
      return (
        <button onClick={onClick}
          onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
          style={{
            background:primary?(hov?'#c8b89a':'#f0ece2'):'none',
            color:primary?'#0a0a08':'#f0ece2',
            border:primary?'none':'1px solid rgba(255,255,255,.25)',
            cursor:'none',padding:'12px 28px',
            fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:'2px',borderRadius:'1px',
            transform:hov?'translateY(-2px)':'none',
            transition:'transform .2s,background .2s,border-color .2s',
            ...((!primary&&hov)?{borderColor:'rgba(255,255,255,.65)'}:{}),
          }}>{children}</button>
      );
    }
    function BackBtn({onClick}) {
      const [hov,setHov]=useState(false);
      return (
        <button onClick={onClick}
          onMouseEnter={()=>hov||null} onMouseLeave={()=>null}
          style={{
            background:'none',border:'none',cursor:'none',padding:'0 0 32px',
            fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:2,
            color:hov?'#c8b89a':'rgba(240,236,226,.35)',transition:'color .2s',
            display:'block',
          }}
          onMouseEnterCapture={()=>null}
          onMouseOver={e=>e.currentTarget.style.color='#c8b89a'}
          onMouseOut={e=>e.currentTarget.style.color='rgba(240,236,226,.35)'}>
          ← ARCHIVE
        </button>
      );
    }
    function Spinner() {
      return <div style={{width:18,height:18,border:'2px solid rgba(200,184,154,.25)',borderTopColor:'#c8b89a',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
